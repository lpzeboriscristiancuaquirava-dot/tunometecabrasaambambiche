quarkus.datasource.db-kind=mysql
quarkus.datasource.username=quarkus_user
quarkus.datasource.password=Mapache_654321
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3310/quarkus_db

# Nivel de Logs
quarkus.log.level=INFO
quarkus.log.category."com.pepe.mirest.Models".level=DEBUG

# Logs en Archivo
quarkus.log.file.enable=true
quarkus.log.file.path=logs/super_aplicacion.log

# Rotación de Logs
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.file.rotation.max-backup-index=5
quarkus.log.file.rotation.rotate-on-boot=true

quarkus.hibernate-orm.database.generation=update